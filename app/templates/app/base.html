<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PTech Django Starter{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #14b8a6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(20, 184, 166, 0.18), transparent 25%),
        linear-gradient(135deg, #020617 0%, #0f172a 48%, #111827 100%);
    }

    a {
      color: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(1040px, 100%);
      padding: 32px;
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.35);
    }

    .kicker {
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 0.78rem;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.4rem, 6vw, 4.8rem);
      line-height: 0.95;
      max-width: 10ch;
    }

    .lead {
      margin: 0;
      max-width: 68ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 28px 0 32px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255, 255, 255, 0.05);
      text-decoration: none;
      font-weight: 700;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.12);
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel {
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(255, 255, 255, 0.04);
    }

    .panel strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.02rem;
    }

    .panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    code {
      padding: 2px 8px;
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.92);
    }

    @media (max-width: 760px) {
      .card {
        padding: 22px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="card">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
