[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptech-django-starter"
version = "0.1.0"
description = "Starter Django project with MySQL, REST API, Jazzmin and Celery"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = [
  "Django>=6.0.5,<6.1",
  "djangorestframework>=3.17.1,<3.18",
  "django-jazzmin>=3.0.4,<3.1",
  "celery>=5.6.3,<5.7",
  "ptech-tools>=0.1.0,<0.2",
  "mysqlclient>=2.2.8,<2.3",
]
license = "MIT"
authors = [
  { name = "PTech" },
]
keywords = ["django", "mysql", "rest-api", "jazzmin", "celery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-django>=4",
]
dev = [
  "build>=1",
  "ruff>=0.9",
]

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "app*"]

[tool.setuptools.package-data]
app = [
  "templates/app/base.html",
  "templates/app/home.html",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
